services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Alle Klassen der Extension als Services
  Webzadev\Hisnulmuslim\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  # Controller müssen public sein und den Controller-Tag haben
  Webzadev\Hisnulmuslim\Controller\:
    resource: '../Classes/Controller/*'
    public: true
    tags: ['controller.service_arguments']

  # Middlewares werden vom Core über die Klasse aus dem Container geholt und müssen public sein
  Webzadev\Hisnulmuslim\Middleware\:
    resource: '../Classes/Middleware/*'
    public: true
